name: Deploy staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite absolute paths for /ht-hair-lounge/ subpath
        run: |
          cd public
          for f in index.html es/index.html vi/index.html; do
            sed -i 's|href="/"|href="/ht-hair-lounge/"|g' "$f"
            sed -i 's|href="/es/"|href="/ht-hair-lounge/es/"|g' "$f"
            sed -i 's|href="/vi/"|href="/ht-hair-lounge/vi/"|g' "$f"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
